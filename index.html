<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Galpões 3D - Acabamento Profissional</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 50: '#f0f9ff', 600: '#3b82f6', 900: '#1e3a8a' } } } }
        }
    </script>
    <style>
        #canvas-container { width: 100%; height: 100%; min-height: 700px; cursor: grab; outline: none; }
        #canvas-container:active { cursor: grabbing; }
        input[type="color"] { appearance: none; -webkit-appearance: none; border: none; width: 2rem; height: 2rem; border-radius: 9999px; cursor: pointer; padding: 0; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #e5e7eb; border-radius: 9999px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-600 rounded flex items-center justify-center text-white font-bold text-xl">GE</div>
                <h1 class="text-xl font-bold text-brand-900 tracking-tight">Galpões Engenharia</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="App.toggleCotas()" id="btn-cotas" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold shadow-md transition-all text-sm">
                    Cotas: Desligadas
                </button>
                <button onclick="App.togglePortao()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-bold shadow-md transition-all text-sm">
                    Abrir / Fechar Portão
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex flex-col lg:flex-row gap-8">
        
        <div class="w-full lg:w-1/3 flex flex-col gap-4 overflow-y-auto pr-2" style="max-height: 80vh;">
            
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-bold mb-3 text-gray-800 border-b pb-2">1. Estrutura</h2>
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Frente (m)</label>
                            <input type="number" id="frente" value="15" min="5" max="50" step="1" class="w-full px-3 py-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Comprimento (m)</label>
                            <input type="number" id="comprimento" value="25" min="10" max="100" step="1" class="w-full px-3 py-2 bg-gray-50 rounded-lg border border-gray-300 focus:ring-2 outline-none text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Tipo de Portão</label>
                        <select id="tipoPortao" onchange="App.atualizarSimulacao()" class="w-full px-3 py-2 bg-gray-50 rounded-lg border border-gray-300 text-sm outline-none">
                            <option value="correr">Portão de Correr Lateral</option>
                            <option value="duas_folhas">Portão 2 Folhas Industrial</option>
                        </select>
                    </div>
                    <button onclick="App.atualizarSimulacao()" class="w-full bg-brand-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow-sm mt-1 text-sm">
                        Atualizar Geometria
                    </button>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-lg font-bold mb-3 text-gray-800 border-b pb-2">2. Cores Extras</h2>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-medium text-gray-700">Paredes</label>
                        <div class="flex items-center gap-2">
                            <button onclick="setCor('corParede', '#e5e7eb')" class="w-6 h-6 rounded-full border border-gray-300" style="background: #e5e7eb;"></button>
                            <button onclick="setCor('corParede', '#a1a1aa')" class="w-6 h-6 rounded-full border border-gray-300" style="background: #a1a1aa;"></button>
                            <input type="color" id="corParede" value="#d4d4d8" oninput="App.atualizarCoresTempoReal()">
                        </div>
                    </div>
                    <div class="flex justify-between items-center">
                        <label class="text-sm font-medium text-gray-700">Pilares</label>
                        <div class="flex items-center gap-2">
                            <button onclick="setCor('corPilar', '#e3e1db')" class="w-6 h-6 rounded-full border border-gray-300" style="background: #e3e1db;"></button>
                            <button onclick="setCor('corPilar', '#9ca3af')" class="w-6 h-6 rounded-full border border-gray-300" style="background: #9ca3af;"></button>
                            <input type="color" id="corPilar" value="#9ca3af" oninput="App.atualizarCoresTempoReal()">
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-brand-900 text-white p-5 rounded-xl shadow-lg">
                <h3 class="text-blue-200 text-xs font-semibold uppercase tracking-wider mb-2">Orçamento Total</h3>
                <div class="flex justify-between items-end">
                    <div>
                        <p class="text-xs text-blue-100 mb-1">Área Total</p>
                        <p class="text-xl font-bold"><span id="area-resultado">375</span><span class="text-xs text-blue-200 ml-1">m²</span></p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-blue-100 mb-1">Custo Estimado</p>
                        <p class="text-xl font-extrabold text-green-400" id="custo-resultado">R$ 0,00</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-2/3 bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden relative">
            <div id="canvas-container" class="w-full h-full"></div>
            
            <div id="loading-screen" class="absolute inset-0 bg-white bg-opacity-95 flex flex-col items-center justify-center z-50 transition-opacity duration-500">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-200 border-t-brand-600 mb-4"></div>
                <h3 class="text-lg font-bold text-brand-900 mb-1">Carregando Estúdio 3D</h3>
                <p class="text-sm text-gray-500 font-medium">Baixando texturas: <span id="loading-progress">0%</span></p>
                <p id="loading-error" class="text-xs text-red-500 mt-4 hidden">Aviso: Alguma textura falhou. Verifique nomes.</p>
            </div>
        </div>

    </main>

    <script>
        const App = {
            CUSTO_BASE_M2: 850.00, ALTURA_PE_DIREITO: 6, ALTURA_PLACA: 1.2,
            
            scene: null, camera: null, renderer: null, controls: null,
            galpaoGroup: null, ambienteGroup: null, cotasGroup: null,
            
            materiais: {}, materialCache: {}, 
            portaoAberto: false, cotasAtivas: false, elementosAnimados: [],

            init: function() {
                this.configurarCena();
                this.configurarGerenciadorDeCarregamento();
                this.carregarTexturasServidor();
                this.loopAnimacao();
                window.addEventListener('resize', () => this.onWindowResize());
            },

            configurarGerenciadorDeCarregamento: function() {
                THREE.DefaultLoadingManager.onProgress = (url, itemsLoaded, itemsTotal) => {
                    const progresso = Math.round((itemsLoaded / itemsTotal) * 100);
                    document.getElementById('loading-progress').innerText = progresso + '%';
                };
                
                THREE.DefaultLoadingManager.onLoad = () => {
                    this.atualizarSimulacao();
                    this.renderer.compile(this.scene, this.camera);
                    document.getElementById('loading-screen').classList.add('opacity-0');
                    setTimeout(() => {
                        document.getElementById('loading-screen').classList.add('hidden');
                    }, 500);
                };

                THREE.DefaultLoadingManager.onError = (url) => {
                    document.getElementById('loading-error').classList.remove('hidden');
                };
            },

            carregarTexturasServidor: function() {
                const loader = new THREE.TextureLoader();
                const path = 'https://BraulioBastosBatista.github.io/simulador-galpao/texturas/';

                const carregarMaterial = (nomeMaterial, imgColor, imgNormal, imgRoughness, extras = {}) => {
                    const map = loader.load(path + imgColor);
                    const normal = loader.load(path + imgNormal);
                    const rough = loader.load(path + imgRoughness);

                    map.colorSpace = THREE.SRGBColorSpace;

                    [map, normal, rough].forEach(tex => {
                        tex.wrapS = THREE.RepeatWrapping;
                        tex.wrapT = THREE.RepeatWrapping;
                        tex.anisotropy = 4; // Ajustado levemente para melhorar as ranhuras do concreto
                    });

                    this.materiais[nomeMaterial] = new THREE.MeshStandardMaterial({
                        map: map, normalMap: normal, roughnessMap: rough,
                        color: '#ffffff', roughness: 0.9, metalness: 0.0,
                        normalScale: new THREE.Vector2(1.2, 1.2), // Deixa o relevo mais marcado e bonito
                        ...extras
                    });
                };
                
                carregarMaterial('parede', 'Parede_Color.jpg', 'Parede_Normal.jpg', 'Parede_Roughness.jpg');
                carregarMaterial('pilar', 'Pilar_Color.jpg', 'Pilar_Normal.jpg', 'Pilar_Roughness.jpg');
                carregarMaterial('porta', 'Portao_Color.jpg', 'Portao_Normal.jpg', 'Portao_Roughness.jpg', { color: '#374151', metalness: 0.2 });
                carregarMaterial('telhado', 'metal_color.jpg', 'metal_normal.jpg', 'metal_roughness.jpg', { color: '#374151', metalness: 0.1 });
                carregarMaterial('patio', 'Bloquete_Color.jpg', 'Bloquete_Normal.jpg', 'Bloquete_Roughness.jpg');

                this.materiais.vidro = new THREE.MeshStandardMaterial({ color: '#101314', roughness: 0.1, metalness: 0.9 });
                this.materiais.rejunte = new THREE.MeshStandardMaterial({ color: '#374151', roughness: 1.0 });
            },

            configurarCena: function() {
                const container = document.getElementById('canvas-container');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color('#dbeafe'); 
                
                this.camera = new THREE.PerspectiveCamera(38, container.clientWidth / container.clientHeight, 0.1, 1000);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
                this.renderer.setSize(container.clientWidth, container.clientHeight);
                
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Sombra mais realista
                this.renderer.outputEncoding = THREE.sRGBEncoding;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.0; 
                container.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                // IMPEDE A CÂMERA DE ATRAVESSAR O CHÃO
                this.controls.maxPolarAngle = Math.PI / 2 - 0.02; 

                const ambientLight = new THREE.AmbientLight('#ffffff', 1.4); 
                this.scene.add(ambientLight);

                const hemiLight = new THREE.HemisphereLight('#dbeafe', '#5b8a5b', 0.6);
                this.scene.add(hemiLight);

                const sunLight = new THREE.DirectionalLight('#fffaed', 0.4); 
                sunLight.position.set(-60, 50, 60); 
                sunLight.castShadow = true;
                sunLight.shadow.mapSize.width = 2048; 
                sunLight.shadow.mapSize.height = 2048;
                sunLight.shadow.camera.near = 0.5; sunLight.shadow.camera.far = 300;
                sunLight.shadow.bias = -0.0005; 
                this.scene.add(sunLight);

                const gramadoGeom = new THREE.PlaneGeometry(2000, 2000);
                const gramadoMat = new THREE.MeshStandardMaterial({ color: '#2d4a2d', roughness: 1.0 }); 
                const gramado = new THREE.Mesh(gramadoGeom, gramadoMat);
                gramado.rotation.x = -Math.PI / 2;
                gramado.position.y = -0.15; 
                gramado.receiveShadow = true;
                this.scene.add(gramado);

                this.galpaoGroup = new THREE.Group();
                this.scene.add(this.galpaoGroup);
                this.ambienteGroup = new THREE.Group();
                this.scene.add(this.ambienteGroup);
                this.cotasGroup = new THREE.Group();
                this.scene.add(this.cotasGroup);
            },

            aplicarEscalaMaterial: function(nomeMaterial, scaleX, scaleY) {
                const materialBase = this.materiais[nomeMaterial];
                if(!materialBase) return new THREE.MeshStandardMaterial({color: '#ccc'}); 

                const cacheKey = `${nomeMaterial}_${scaleX.toFixed(2)}_${scaleY.toFixed(2)}`;
                if (this.materialCache[cacheKey]) return this.materialCache[cacheKey]; 

                const clone = materialBase.clone();
                ['map', 'normalMap', 'roughnessMap'].forEach(mapType => {
                    if (clone[mapType]) {
                        clone[mapType] = clone[mapType].clone();
                        clone[mapType].repeat.set(scaleX, scaleY);
                        clone[mapType].needsUpdate = true;
                    }
                });
                
                this.materialCache[cacheKey] = clone;
                return clone;
            },

            adicionarAoGalpao: function(mesh, animar = false) {
                this.galpaoGroup.add(mesh);
                if (animar) this.elementosAnimados.push(mesh);
            },

            toggleCotas: function() {
                this.cotasAtivas = !this.cotasAtivas;
                const btn = document.getElementById('btn-cotas');
                if (this.cotasAtivas) {
                    btn.innerText = "Cotas: Ligadas";
                    btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                    btn.classList.add('bg-orange-500', 'hover:bg-orange-600');
                    this.atualizarCotas();
                } else {
                    btn.innerText = "Cotas: Desligadas";
                    btn.classList.remove('bg-orange-500', 'hover:bg-orange-600');
                    btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                    if (this.cotasGroup) this.cotasGroup.clear();
                }
            },

            atualizarCotas: function() {
                if (!this.cotasAtivas) return;
                if (this.cotasGroup) this.cotasGroup.clear();

                const frente = parseFloat(document.getElementById('frente').value);
                const comprimento = parseFloat(document.getElementById('comprimento').value);
                const numPlacasAltura = Math.ceil(this.ALTURA_PE_DIREITO / this.ALTURA_PLACA);
                const alturaReal = numPlacasAltura * this.ALTURA_PLACA;
                const altPorta = Math.min(this.ALTURA_PLACA * 3.5, alturaReal - 1);

                const materialLinha = new THREE.LineBasicMaterial({ color: 0x0f172a, linewidth: 2 }); 

                // GERAÇÃO DA COTA COM DESIGN PROFISSIONAL (PÍLULA ARQUITETÔNICA)
                const criarCotaTexto = (texto, x, y, z) => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 512;
                    canvas.height = 128;
                    
                    const radius = 50;
                    ctx.fillStyle = '#0f172a'; // Azul Marinho quase preto
                    ctx.beginPath();
                    ctx.moveTo(radius + 10, 10);
                    ctx.lineTo(502 - radius, 10);
                    ctx.quadraticCurveTo(502, 10, 502, 10 + radius);
                    ctx.lineTo(502, 118 - radius);
                    ctx.quadraticCurveTo(502, 118, 502 - radius, 118);
                    ctx.lineTo(radius + 10, 118);
                    ctx.quadraticCurveTo(10, 118, 10, 118 - radius);
                    ctx.lineTo(10, 10 + radius);
                    ctx.quadraticCurveTo(10, 10, radius + 10, 10);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 6;
                    ctx.stroke();

                    ctx.font = 'bold 44px "Segoe UI", Arial, sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(texto, canvas.width / 2, canvas.height / 2);
                    
                    const texture = new THREE.CanvasTexture(canvas);
                    texture.anisotropy = 4;
                    // depthTest: false faz com que a etiqueta fique sempre visível, sem entrar nas paredes
                    const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
                    const sprite = new THREE.Sprite(spriteMaterial);
                    sprite.scale.set(4, 1, 1);
                    sprite.position.set(x, y, z);
                    sprite.renderOrder = 999; 
                    this.cotasGroup.add(sprite);
                };

                const criarCota = (p1, p2, normalTick, texto, offsetTexto) => {
                    const geometry = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                    const line = new THREE.Line(geometry, materialLinha);
                    this.cotasGroup.add(line);

                    const tickSize = 0.4;
                    const t1 = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
                        p1.clone().add(normalTick.clone().multiplyScalar(tickSize)),
                        p1.clone().add(normalTick.clone().multiplyScalar(-tickSize))
                    ]), materialLinha);
                    const t2 = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
                        p2.clone().add(normalTick.clone().multiplyScalar(tickSize)),
                        p2.clone().add(normalTick.clone().multiplyScalar(-tickSize))
                    ]), materialLinha);
                    
                    this.cotasGroup.add(t1);
                    this.cotasGroup.add(t2);

                    const center = p1.clone().lerp(p2, 0.5).add(offsetTexto);
                    criarCotaTexto(texto, center.x, center.y, center.z);
                };

                const offX = (frente / 2) + 2.0;
                const offZ = (comprimento / 2) + 2.0;

                // 1. Frente
                criarCota(
                    new THREE.Vector3(-frente/2, 0.1, offZ), 
                    new THREE.Vector3(frente/2, 0.1, offZ), 
                    new THREE.Vector3(0, 0, 1), 
                    `LARGURA: ${frente}m`, 
                    new THREE.Vector3(0, 0, 0.8)
                );

                // 2. Comprimento
                criarCota(
                    new THREE.Vector3(offX, 0.1, -comprimento/2), 
                    new THREE.Vector3(offX, 0.1, comprimento/2), 
                    new THREE.Vector3(1, 0, 0), 
                    `COMPRIMENTO: ${comprimento}m`, 
                    new THREE.Vector3(1.2, 0, 0)
                );

                // 3. Altura Telhado
                const offXAlt = offX + 1.5;
                criarCota(
                    new THREE.Vector3(offXAlt, 0, 0), 
                    new THREE.Vector3(offXAlt, alturaReal, 0), 
                    new THREE.Vector3(1, 0, 0), 
                    `PÉ-DIREITO: ${alturaReal.toFixed(1)}m`, 
                    new THREE.Vector3(1.2, 0, 0)
                );

                // 4. Altura Portão
                const offXPorta = -frente/2 - 1.5;
                criarCota(
                    new THREE.Vector3(offXPorta, 0, comprimento/2), 
                    new THREE.Vector3(offXPorta, altPorta, comprimento/2), 
                    new THREE.Vector3(1, 0, 0), 
                    `ALTURA: ${altPorta.toFixed(1)}m`, 
                    new THREE.Vector3(-1.4, 0, 0)
                );
            },

            construirAmbiente: function(frente, comprimento) {
                this.ambienteGroup.traverse((child) => { if (child.isMesh && child.geometry) child.geometry.dispose(); });
                this.ambienteGroup.clear();
                
                const profEstacionamento = 15;
                const largPatio = frente + 10;
                const profPatio = comprimento + profEstacionamento;
                
                const patioGeom = new THREE.BoxGeometry(largPatio, 0.15, profPatio);
                const clonePatioMat = this.aplicarEscalaMaterial('patio', largPatio/3, profPatio/3);
                const sideMat = new THREE.MeshStandardMaterial({ color: '#888888', roughness: 0.9 });
                
                const patioMaterials = [sideMat, sideMat, clonePatioMat, sideMat, sideMat, sideMat];
                const patio = new THREE.Mesh(patioGeom, patioMaterials);
                patio.position.set(0, -0.075, profEstacionamento / 3); 
                patio.receiveShadow = true;
                patio.castShadow = true;
                this.ambienteGroup.add(patio);
            },

            construirGalpao: function(frente, comprimento) {
                this.galpaoGroup.traverse((child) => { if (child.isMesh && child.geometry) child.geometry.dispose(); });
                this.galpaoGroup.clear();
                this.elementosAnimados = [];
                this.portaoAberto = false;

                const tipoPortao = document.getElementById('tipoPortao').value;
                const corPilar = document.getElementById('corPilar').value;
                const corParede = document.getElementById('corParede').value;
                
                if(this.materiais.pilar) this.materiais.pilar.color.set(corPilar);
                if(this.materiais.parede) this.materiais.parede.color.set(corParede);

                const ESPACO_MAX_PILAR = 5;
                const numVaosZ = Math.max(1, Math.ceil(comprimento / ESPACO_MAX_PILAR));
                const tamVaoZ = comprimento / numVaosZ;
                const numVaosX = Math.max(1, Math.ceil(frente / ESPACO_MAX_PILAR));
                const tamVaoX = frente / numVaosX;
                
                const largPilar = 0.4; const profPilar = 0.55; 
                const espessuraParede = 0.15;
                const numPlacasAltura = Math.ceil(this.ALTURA_PE_DIREITO / this.ALTURA_PLACA);
                const alturaReal = numPlacasAltura * this.ALTURA_PLACA; 

                const pisoInterno = new THREE.Mesh(new THREE.PlaneGeometry(frente - 0.5, comprimento - 0.5), new THREE.MeshStandardMaterial({color: '#282b2e'}));
                pisoInterno.rotation.x = -Math.PI / 2; pisoInterno.position.y = 0.02;
                pisoInterno.receiveShadow = true;
                this.galpaoGroup.add(pisoInterno); 

                const _this = this;
                function criarPilar(x, z) {
                    const mat = _this.aplicarEscalaMaterial('pilar', largPilar, alturaReal/2);
                    const pilar = new THREE.Mesh(new THREE.BoxGeometry(largPilar, alturaReal, profPilar), mat);
                    pilar.position.set(x, alturaReal/2, z);
                    pilar.castShadow = true; pilar.receiveShadow = true;
                    _this.adicionarAoGalpao(pilar, false);
                }

                for (let i = 0; i <= numVaosZ; i++) {
                    let posZ = -comprimento/2 + (i * tamVaoZ);
                    criarPilar(-frente/2, posZ); criarPilar(frente/2, posZ);
                    if (i < numVaosZ) {
                        this.gerarPlacas(-frente/2, posZ + (tamVaoZ / 2), tamVaoZ - largPilar, numPlacasAltura, espessuraParede, false);
                        this.gerarPlacas(frente/2, posZ + (tamVaoZ / 2), tamVaoZ - largPilar, numPlacasAltura, espessuraParede, true);
                    }
                }

                const meioVaoX = Math.floor((numVaosX - 1) / 2); 

                for (let i = 0; i <= numVaosX; i++) {
                    let posX = -frente/2 + (i * tamVaoX);
                    
                    if (i > 0 && i < numVaosX) {
                        const mat = _this.aplicarEscalaMaterial('pilar', profPilar, alturaReal/2);
                        const pFundo = new THREE.Mesh(new THREE.BoxGeometry(profPilar, alturaReal, largPilar), mat);
                        pFundo.position.set(posX, alturaReal/2, -comprimento/2); pFundo.castShadow = true; pFundo.receiveShadow = true; this.adicionarAoGalpao(pFundo, false);

                        const pFrente = new THREE.Mesh(new THREE.BoxGeometry(profPilar, alturaReal, largPilar), mat);
                        pFrente.position.set(posX, alturaReal/2, comprimento/2); pFrente.castShadow = true; pFrente.receiveShadow = true; this.adicionarAoGalpao(pFrente, false);
                    }
                    
                    if (i < numVaosX) {
                        let xCentro = posX + (tamVaoX / 2);
                        let tamPainel = tamVaoX - largPilar;
                        this.gerarPlacas(xCentro, -comprimento/2, tamPainel, numPlacasAltura, espessuraParede, false, true);

                        if (i === meioVaoX) { 
                            const altPorta = Math.min(this.ALTURA_PLACA * 3.5, alturaReal - 1); 
                            
                            if (tipoPortao === 'correr') {
                                const sobreposicao = 0.06;
                                const pMat = this.aplicarEscalaMaterial('porta', tamPainel/2, altPorta/2);
                                const porta = new THREE.Mesh(new THREE.BoxGeometry(tamPainel + sobreposicao, altPorta - 0.02, 0.1), pMat);
                                porta.position.set(xCentro, (altPorta - 0.02)/2, (comprimento/2) + 0.18); 
                                porta.castShadow = true; 
                                porta.userData.animAbertoX = xCentro + (tamPainel + sobreposicao); 
                                porta.userData.animFechadoX = xCentro; 
                                porta.userData.isPortaCorrer = true;
                                this.adicionarAoGalpao(porta, true);

                            } else if (tipoPortao === 'duas_folhas') {
                                const sobreposicao = 0.02; 
                                const largFolha = (tamPainel + (sobreposicao * 2)) / 2;
                                const pMat = this.aplicarEscalaMaterial('porta', largFolha/2, altPorta/2);
                                
                                const hingeEsq = new THREE.Group(); 
                                hingeEsq.position.set(xCentro - tamPainel/2 - sobreposicao, 0, comprimento/2 + 0.18);
                                
                                const hFolha = altPorta - 0.04;
                                const folhaEsq = new THREE.Mesh(new THREE.BoxGeometry(largFolha, hFolha, 0.08), pMat); 
                                folhaEsq.position.set(largFolha/2, hFolha/2, 0); 
                                folhaEsq.castShadow = true; 
                                hingeEsq.add(folhaEsq);
                                
                                const matLinhaDivisoria = new THREE.MeshStandardMaterial({ color: '#111111', roughness: 0.9 });
                                const hLinha = hFolha + 0.02; 
                                const linhaDivisoria = new THREE.Mesh(new THREE.BoxGeometry(0.06, hLinha, 0.14), matLinhaDivisoria);
                                linhaDivisoria.position.set(largFolha, hLinha/2, 0); 
                                linhaDivisoria.castShadow = true;
                                hingeEsq.add(linhaDivisoria);

                                hingeEsq.userData.animAbertoR = Math.PI / 2; 
                                hingeEsq.userData.animFechadoR = 0; 
                                hingeEsq.userData.isPortaGiro = true; 
                                this.galpaoGroup.add(hingeEsq); 
                                this.elementosAnimados.push(hingeEsq); 

                                const hingeDir = new THREE.Group(); 
                                hingeDir.position.set(xCentro + tamPainel/2 + sobreposicao, 0, comprimento/2 + 0.18);
                                
                                const folhaDir = new THREE.Mesh(new THREE.BoxGeometry(largFolha - 0.01, hFolha, 0.08), pMat); 
                                folhaDir.position.set(-(largFolha - 0.01)/2, hFolha/2, 0); 
                                folhaDir.castShadow = true; 
                                hingeDir.add(folhaDir);
                                
                                hingeDir.userData.animAbertoR = -Math.PI / 2; 
                                hingeDir.userData.animFechadoR = 0; 
                                hingeDir.userData.isPortaGiro = true; 
                                this.galpaoGroup.add(hingeDir); 
                                this.elementosAnimados.push(hingeDir);
                            }
                            
                            let bordaEsqTrilho, bordaDirTrilho;
                            if (tipoPortao === 'correr') {
                                bordaEsqTrilho = xCentro - (tamPainel / 2) - 0.05;
                                bordaDirTrilho = xCentro + (tamPainel * 1.5) + 0.05;
                            } else {
                                bordaEsqTrilho = xCentro - ((tamPainel + largPilar) / 2);
                                bordaDirTrilho = xCentro + ((tamPainel + largPilar) / 2);
                            }
                            
                            const limiteGalpaoEsq = -frente / 2;
                            const limiteGalpaoDir = frente / 2;

                            if (bordaEsqTrilho < limiteGalpaoEsq) bordaEsqTrilho = limiteGalpaoEsq;
                            if (bordaDirTrilho > limiteGalpaoDir) bordaDirTrilho = limiteGalpaoDir;

                            const larguraFinalTrilho = bordaDirTrilho - bordaEsqTrilho;
                            const centroFinalTrilho = bordaEsqTrilho + (larguraFinalTrilho / 2);

                            const trilho = new THREE.Mesh(new THREE.BoxGeometry(larguraFinalTrilho, 0.15, 0.25), new THREE.MeshStandardMaterial({color: '#333'}));
                            trilho.position.set(centroFinalTrilho, altPorta + 0.075, (comprimento/2) + 0.15); 
                            trilho.castShadow = true; 
                            this.adicionarAoGalpao(trilho, false);

                            const altRestante = alturaReal - altPorta;
                            if(altRestante > 0) {
                                const pMat = this.aplicarEscalaMaterial('parede', tamPainel/3, altRestante/3);
                                const fechamento = new THREE.Mesh(new THREE.BoxGeometry(tamPainel - 0.03, altRestante - 0.03, espessuraParede), pMat);
                                fechamento.position.set(xCentro, altPorta + (altRestante/2), comprimento/2); fechamento.castShadow = true; this.adicionarAoGalpao(fechamento, false);
                            }
                        } else {
                            this.gerarPlacas(xCentro, comprimento/2, tamPainel, numPlacasAltura, espessuraParede, false, true);
                        }
                    }
                }

                // CORREÇÃO DEFINITIVA DOS BEIRAIS (Overhang do Telhado)
                const inclinacao = 0.15; 
                const alturaCumeeira = (frente / 2) * inclinacao;
                const beiralFrontalFundo = 0.8; 
                const beiralLateral = 0.8;

                const oitaoShape = new THREE.Shape(); oitaoShape.moveTo(-frente/2, 0); oitaoShape.lineTo(0, alturaCumeeira); oitaoShape.lineTo(frente/2, 0);
                const oitaoGeom = new THREE.ExtrudeGeometry(oitaoShape, { depth: espessuraParede, bevelEnabled: false }); oitaoGeom.translate(0, 0, -espessuraParede/2);
                
                const oMat = this.aplicarEscalaMaterial('telhado', frente/4, 1);
                const oitaoFrente = new THREE.Mesh(oitaoGeom, oMat); oitaoFrente.position.set(0, alturaReal, comprimento/2); oitaoFrente.castShadow = true; this.adicionarAoGalpao(oitaoFrente, false);
                const oitaoFundo = new THREE.Mesh(oitaoGeom, oMat); oitaoFundo.position.set(0, alturaReal, -comprimento/2); oitaoFundo.castShadow = true; this.adicionarAoGalpao(oitaoFundo, false);

                // Cálculo exato do tamanho das placas do telhado considerando os beirais
                const largRampa = (frente / 2) + beiralLateral; 
                const altRampa = largRampa * inclinacao; 
                const compRampa = Math.sqrt(Math.pow(largRampa, 2) + Math.pow(altRampa, 2)); 
                const anguloTelhado = Math.atan(inclinacao);
                const compTelhadoZ = comprimento + (beiralFrontalFundo * 2);

                const tMat = this.aplicarEscalaMaterial('telhado', compTelhadoZ/3, compRampa/3);
                if(tMat.map) tMat.map.rotation = Math.PI / 2; if(tMat.normalMap) tMat.normalMap.rotation = Math.PI / 2; if(tMat.roughnessMap) tMat.roughnessMap.rotation = Math.PI / 2;

                const telhaDir = new THREE.Mesh(new THREE.BoxGeometry(compRampa, 0.1, compTelhadoZ), tMat); 
                telhaDir.position.set(largRampa/2, alturaReal + (altRampa/2) + 0.05, 0); 
                telhaDir.rotation.z = -anguloTelhado; 
                telhaDir.castShadow = true; 
                this.adicionarAoGalpao(telhaDir, false);

                const telhaEsq = new THREE.Mesh(new THREE.BoxGeometry(compRampa, 0.1, compTelhadoZ), tMat); 
                telhaEsq.position.set(-largRampa/2, alturaReal + (altRampa/2) + 0.05, 0); 
                telhaEsq.rotation.z = anguloTelhado; 
                telhaEsq.castShadow = true; 
                this.adicionarAoGalpao(telhaEsq, false);

                this.construirAmbiente(frente, comprimento);
                if (this.cotasAtivas) this.atualizarCotas();

                const maxDim = Math.max(frente, comprimento);
                this.camera.position.set(-frente * 1.4, alturaReal * 1.8, comprimento * 1.3);
                this.controls.target.set(0, alturaReal / 2.5, 0);
                this.controls.update();
            },

            gerarPlacas: function(x, z, larguraPainel, numPlacas, espessura, isLateral, isFachada = false) {
                const gap = 0.03; 

                const criarPlaca = (w, h, px, py, pz, mat, isVidro = false) => {
                    const wPlaca = isFachada ? w - gap : espessura;
                    const hPlaca = isVidro ? h : h - gap;
                    const dPlaca = !isFachada ? w - gap : espessura;
                    
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(wPlaca, hPlaca, dPlaca), mat);
                    mesh.position.set(px, py, pz);
                    if (!isVidro) mesh.castShadow = true;
                    this.adicionarAoGalpao(mesh, false);

                    if (!isVidro) {
                        const wRejunte = isFachada ? w : espessura - 0.06;
                        const dRejunte = !isFachada ? w : espessura - 0.06;
                        
                        const rejunte = new THREE.Mesh(new THREE.BoxGeometry(wRejunte, h, dRejunte), this.materiais.rejunte);
                        rejunte.position.set(px, py, pz);
                        this.adicionarAoGalpao(rejunte, false);
                    }
                };

                for(let i=0; i<numPlacas; i++) {
                    const altY = (i * this.ALTURA_PLACA) + (this.ALTURA_PLACA/2);
                    let temJanela = isLateral && i === (numPlacas - 2) && numPlacas >= 3;
                    const pMat = this.aplicarEscalaMaterial('parede', larguraPainel/3, this.ALTURA_PLACA/3);

                    if (temJanela) {
                        const largJanela = larguraPainel * 0.75; 
                        const margemX = (larguraPainel - largJanela) / 2;
                        const altVidro = this.ALTURA_PLACA * 0.5; 
                        const margemY = (this.ALTURA_PLACA - altVidro) / 2;

                        const pxEsq = isFachada ? x - (larguraPainel/2) + (margemX/2) : x;
                        const pzEsq = !isFachada ? z - (larguraPainel/2) + (margemX/2) : z;
                        criarPlaca(margemX, this.ALTURA_PLACA, pxEsq, altY, pzEsq, pMat);

                        const pxDir = isFachada ? x + (larguraPainel/2) - (margemX/2) : x;
                        const pzDir = !isFachada ? z + (larguraPainel/2) - (margemX/2) : z;
                        criarPlaca(margemX, this.ALTURA_PLACA, pxDir, altY, pzDir, pMat);

                        const pyTop = altY + (this.ALTURA_PLACA/2) - (margemY/2);
                        criarPlaca(largJanela, margemY, x, pyTop, z, pMat);

                        const pyBot = altY - (this.ALTURA_PLACA/2) + (margemY/2);
                        criarPlaca(largJanela, margemY, x, pyBot, z, pMat);

                        criarPlaca(largJanela, altVidro, x, altY, z, this.materiais.vidro, true);
                    } else {
                        criarPlaca(larguraPainel, this.ALTURA_PLACA, x, altY, z, pMat);
                    }
                }
            },

            togglePortao: function() { this.portaoAberto = !this.portaoAberto; },

            loopAnimacao: function() {
                requestAnimationFrame(() => this.loopAnimacao());
                this.controls.update();
                
                const lerp = (start, end, factor) => {
                    const result = start + (end - start) * factor;
                    return Math.abs(end - result) < 0.005 ? end : result;
                };

                this.elementosAnimados.forEach(el => {
                    if (el.userData.isPortaCorrer) el.position.x = lerp(el.position.x, this.portaoAberto ? el.userData.animAbertoX : el.userData.animFechadoX, 0.08);
                    if (el.userData.isPortaGiro) el.rotation.y = lerp(el.rotation.y, this.portaoAberto ? el.userData.animAbertoR : el.userData.animFechadoR, 0.08);
                });
                this.renderer.render(this.scene, this.camera); 
            },

            atualizarCoresTempoReal: function() {
                const corParede = document.getElementById('corParede').value;
                const corPilar = document.getElementById('corPilar').value;

                if(this.materiais.parede) this.materiais.parede.color.set(corParede);
                if(this.materiais.pilar) this.materiais.pilar.color.set(corPilar);

                Object.keys(this.materialCache).forEach(key => {
                    if (key.startsWith('parede_')) this.materialCache[key].color.set(corParede);
                    if (key.startsWith('pilar_')) this.materialCache[key].color.set(corPilar);
                });
            },

            atualizarSimulacao: function() {
                const frente = parseFloat(document.getElementById('frente').value);
                const comprimento = parseFloat(document.getElementById('comprimento').value);
                if(isNaN(frente) || isNaN(comprimento) || frente < 5 || comprimento < 5) return;

                const area = frente * comprimento;
                let custoTotal = area * this.CUSTO_BASE_M2;
                
                const tipoPortao = document.getElementById('tipoPortao').value;
                if (tipoPortao === 'correr') custoTotal += 2500;
                else if (tipoPortao === 'duas_folhas') custoTotal += 4500;

                document.getElementById('area-resultado').innerText = area.toLocaleString('pt-BR');
                document.getElementById('custo-resultado').innerText = custoTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                this.construirGalpao(frente, comprimento);
            },
            
            onWindowResize: function() {
                const container = document.getElementById('canvas-container');
                this.camera.aspect = container.clientWidth / container.clientHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(container.clientWidth, container.clientHeight);
            }
        };

        function setCor(id, hexColor) { document.getElementById(id).value = hexColor; App.atualizarCoresTempoReal(); }
        window.onload = () => App.init();
    </script>
</body>
</html>
